<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f8fc">
<meta name="description" content="Prototipe ruang kelas digital untuk membagikan tugas, mengumpulkan berkas, dan memantau progres siswa.">
<title>KelasKita — Ruang Tugas</title>
<style>
:root{--ink:#18283f;--muted:#77859a;--line:#e8edf3;--paper:#fff;--bg:#f6f8fc;--nav:#142d43;--teal:#078b82;--teal2:#18ad9d;--mint:#e3f6f1;--blue:#eaf1ff;--blueink:#486bb2;--amber:#fff3dc;--amberink:#a66b0b;--red:#fff0ee;--redink:#b84d48;--shadow:0 12px 36px #19324d0a;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:var(--nav);color:#d2e0e8;padding:22px 16px;display:flex;flex-direction:column;gap:26px;min-height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:1px 8px}.brandmark{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#41d0b7,#07978d);display:grid;place-items:center;color:white;font-size:20px;font-weight:900;box-shadow:0 8px 20px #00b79d33}.brand b{display:block;color:white;font-size:15px;letter-spacing:-.2px}.brand small{color:#90abb8;font-size:10px;letter-spacing:1.3px;text-transform:uppercase}.navlabel{color:#7894a5;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;padding:0 11px 7px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8cbd4;padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:650}.nav button:hover{background:#ffffff12;color:white}.nav button.active{background:#ffffff18;color:#fff;box-shadow:inset 3px 0 #39cfb5}.ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.side-tip{border:1px solid #ffffff1c;background:#ffffff0a;border-radius:14px;padding:13px;color:#b9cbd4;font-size:10px;line-height:1.65}.side-tip b{display:block;color:white;font-size:11px;margin-bottom:4px}.profile{border-top:1px solid #ffffff1c;padding:15px 8px 0;display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:12px;background:#d8f5ed;color:#087f77;display:grid;place-items:center;font-weight:850;font-size:11px;flex:none}.profile b{display:block;color:#fff;font-size:11px}.profile small{color:#91a9b6;font-size:9px}.main{min-width:0}.top{height:72px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.crumb{color:var(--muted);font-size:11px}.crumb b{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:10px}.today{font-size:10px;color:#718096;border:1px solid var(--line);padding:8px 10px;border-radius:10px;background:white}.role{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.role select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:white;color:var(--ink);font-weight:700;font-size:10px}.wrap{max-width:1450px;margin:auto;padding:28px 34px 48px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}.eyebrow{color:var(--teal);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:850;margin-bottom:5px}.heading h1{font-size:27px;letter-spacing:-.8px;margin:0 0 4px}.heading p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-size:10px;font-weight:750;transition:.16s}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px #18334c12}.btn.primary{background:var(--teal);border-color:var(--teal);color:white;box-shadow:0 6px 15px #078b822b}.btn.soft{border-color:transparent;background:var(--mint);color:#087d75}.btn.ghost{border-color:transparent;background:#f1f4f8;color:#5e6b7d}.btn.danger{border-color:transparent;background:var(--red);color:var(--redink)}.btn.small{padding:7px 9px;font-size:9px}.notice{display:flex;gap:9px;align-items:flex-start;background:#f0f8ff;border:1px solid #dceaf8;color:#48657d;border-radius:13px;padding:11px 14px;font-size:10px;margin-bottom:17px}.notice b{color:#31546f}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}.stat{padding:16px 18px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:750}.stat-icon{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;background:#e9f7f4;color:var(--teal);font-size:15px}.stat-value{font-size:27px;line-height:1.1;letter-spacing:-1px;font-weight:850;margin:11px 0 4px}.stat-foot{color:var(--muted);font-size:9px}.columns{grid-template-columns:minmax(0,1.48fr) minmax(260px,.8fr);align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-head h2{font-size:13px;margin:0}.section-head p{font-size:9px;color:var(--muted);margin:3px 0 0}.textbtn{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;color:#68778a;border-radius:9px;padding:7px 9px;font-size:9px;font-weight:700}.filter.active{background:#e6f6f3;color:var(--teal);border-color:#d7eee8}.task-list{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:start;transition:.15s}.task:hover{border-color:#beded8;box-shadow:0 7px 18px #14354a0a}.task-icon{height:40px;width:40px;border-radius:12px;display:grid;place-items:center;background:#e9f7f4;font-size:17px}.task h3{font-size:11px;margin:0 0 4px}.task p{margin:0 0 8px;color:var(--muted);font-size:9px}.task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:99px;background:#f1f4f7;color:#647286;font-size:8px;font-weight:800;white-space:nowrap}.pill:before{content:"";height:5px;width:5px;border-radius:50%;background:currentColor}.pill.green{background:var(--mint);color:#16806f}.pill.blue{background:var(--blue);color:var(--blueink)}.pill.gold{background:var(--amber);color:var(--amberink)}.task-side{text-align:right}.task-side b{display:block;font-size:10px}.task-side small{color:var(--muted);font-size:8px}.progress{height:6px;border-radius:99px;background:#eef1f5;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#0d9c90,#54c8ac);border-radius:inherit}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;margin-top:4px}.class-list{display:grid;gap:9px}.classrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}.classmark{height:35px;width:35px;display:grid;place-items:center;background:#f0f4ff;color:#5974bb;border-radius:11px;font-weight:850;font-size:10px}.classrow b{display:block;font-size:10px}.classrow small{display:block;color:var(--muted);font-size:8px}.classrow .count{margin-left:auto;color:#738196;font-size:9px;font-weight:750}.activity{display:grid}.event{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2f5}.event:last-child{border:0}.event-mark{height:28px;width:28px;border-radius:9px;background:#eef8f6;display:grid;place-items:center;flex:none}.event b{display:block;font-size:9px}.event small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;text-transform:uppercase;color:#99a4b4;font-size:8px;letter-spacing:.7px;padding:9px 7px;border-bottom:1px solid var(--line)}.table td{font-size:9px;padding:10px 7px;border-bottom:1px solid #f1f3f6}.table tr:last-child td{border:0}.student{display:flex;align-items:center;gap:7px}.student .avatar{width:25px;height:25px;border-radius:9px;font-size:8px}.empty{padding:23px;text-align:center;color:var(--muted);font-size:10px}.modal{position:fixed;inset:0;z-index:20;background:#0e233c82;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalcard{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:21px;box-shadow:0 24px 90px #08172b55}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modalhead h2{font-size:16px;margin:0}.close{border:0;background:#f1f4f7;border-radius:9px;width:30px;height:30px;color:#5f7080}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800;color:#67778a}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);font-size:10px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7ec9bd;box-shadow:0 0 0 3px #0d9c9012}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.upload{border:1px dashed #9ccec5;border-radius:13px;padding:15px;background:#f7fcfa;text-align:center;color:#70878b;font-size:9px}.upload input{display:block;margin:9px auto 0;max-width:100%}.toast{position:fixed;z-index:30;bottom:18px;right:20px;background:#132d43;color:white;border-radius:11px;padding:11px 15px;font-size:10px;box-shadow:0 12px 30px #172f4540;opacity:0;transform:translateY(7px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.footer{text-align:center;color:#a4adba;font-size:8px;margin-top:22px}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:208px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:24px}.top{padding:0 24px}.columns{grid-template-columns:1fr}.side-extra{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media(max-width:690px){.app{display:block}.sidebar{position:fixed;z-index:12;left:0;top:0;width:250px;min-height:100vh;transform:translateX(-105%);transition:.2s;box-shadow:0 14px 45px #11283d55}.sidebar.open{transform:translateX(0)}.top{height:61px;padding:0 12px}.mobile-menu{display:grid;border:1px solid var(--line);background:white;border-radius:9px;width:32px;height:32px;place-items:center;color:var(--ink)}.crumb{margin-left:8px;margin-right:auto}.today{display:none}.role>span{display:none}.role select{max-width:117px;padding:8px}.wrap{padding:20px 13px 35px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:23px}.heading>.btn{width:100%}.stats{gap:9px}.card{padding:14px;border-radius:15px}.stat{padding:13px}.stat-value{font-size:23px}.stat-foot{font-size:8px}.task{grid-template-columns:35px minmax(0,1fr);padding:11px;gap:9px}.task-icon{width:34px;height:34px}.task-side{grid-column:2;display:flex;align-items:center;justify-content:space-between;text-align:left}.task-side small{margin-left:6px}.task-side .btn{margin-left:auto}.side-extra{display:block}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.filters{width:100%}.filter{flex:1}.section-head{align-items:flex-start}.table{min-width:600px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">K</div><div><b>KelasKita</b><small>ruang belajar</small></div></div>
  <div><div class="navlabel">Menu utama</div><nav class="nav" id="nav">
    <button class="active" data-page="home"><span class="ico">⌂</span>Ringkasan</button>
    <button data-page="classes"><span class="ico">▦</span>Kelas & Mapel</button>
    <button data-page="tasks"><span class="ico">▤</span>Daftar Tugas</button>
    <button data-page="submissions"><span class="ico">↥</span>Pengumpulan</button>
  </nav></div>
  <div class="side-bottom"><div class="side-tip"><b>Ruang kelas digital</b>Bagikan instruksi, kumpulkan berkas, dan lihat progres kelas dalam satu tempat.</div><div class="profile"><div class="avatar" id="profileAvatar">GR</div><div><b id="profileName">Guru Demo</b><small id="profileRole">Pengajar · Akun simulasi</small></div></div></div>
</aside>
<main class="main">
<header class="top"><button class="mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button><div class="crumb">Ruang belajar <span> / </span><b id="crumb">Ringkasan</b></div><div class="top-actions"><span class="today">● &nbsp;Tahun ajaran 2026/2027</span><label class="role"><span>Mode demo</span><select id="roleSelect" aria-label="Pilih peran"><option>Guru</option><option>Siswa</option></select></label></div></header>
<div class="wrap" id="view"></div>
</main></div>
<div class="modal" id="modal"><div class="modalcard"><div class="modalhead"><h2 id="modalTitle">Buat tugas baru</h2><button class="close" id="closeModal" aria-label="Tutup">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
const classes=[{name:'Kelas 7A',subject:'Matematika',students:28,mark:'7A',color:'blue'},{name:'Kelas 8B',subject:'Bahasa Indonesia',students:26,mark:'8B',color:'purple'},{name:'Kelas 9A',subject:'IPA Terpadu',students:30,mark:'9A',color:'green'}];
let tasks=[
{id:1,title:'Rangkuman Bab Pecahan',subject:'Matematika',className:'Kelas 7A',due:'Hari ini · 20.00',description:'Buat rangkuman konsep pecahan dan sertakan 3 contoh soal beserta penyelesaiannya.',submitted:22,total:28,files:2,kind:'Dokumen',status:'Berjalan'},
{id:2,title:'Teks Observasi Lingkungan',subject:'Bahasa Indonesia',className:'Kelas 8B',due:'Besok · 18.00',description:'Amati satu tempat di sekitar rumah. Susun teks laporan hasil observasi dan unggah sebagai dokumen.',submitted:18,total:26,files:1,kind:'Dokumen',status:'Berjalan'},
{id:3,title:'Percobaan Perubahan Wujud',subject:'IPA Terpadu',className:'Kelas 9A',due:'Jumat · 20.00',description:'Rekam atau foto percobaan sederhana, kemudian tuliskan kesimpulan singkat.',submitted:27,total:30,files:3,kind:'Foto / dokumen',status:'Berjalan'}];
let submissions=[{student:'Alya Putri',initial:'AP',task:'Rangkuman Bab Pecahan',className:'Kelas 7A',time:'14.35',file:'rangkuman-pecahan.pdf',state:'Menunggu diperiksa'},{student:'Rizky Mahendra',initial:'RM',task:'Teks Observasi Lingkungan',className:'Kelas 8B',time:'13.58',file:'observasi-taman.docx',state:'Menunggu diperiksa'},{student:'Nadia Zahra',initial:'NZ',task:'Percobaan Perubahan Wujud',className:'Kelas 9A',time:'12.42',file:'percobaan-air.jpg',state:'Sudah diperiksa'}];
let role='Guru',page='home',filter='Semua';const view=document.getElementById('view');const names={home:'Ringkasan',classes:'Kelas & Mapel',tasks:'Daftar Tugas',submissions:'Pengumpulan'};
const notice=()=>`<div class="notice"><span>ℹ</span><span><b>Prototipe demonstrasi.</b> Data contoh tersimpan sementara di halaman ini. Akun, penyimpanan berkas, notifikasi, dan sinkronisasi kelas belum terhubung ke server.</span></div>`;
function header(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${role==='Guru'?'Panel pengajar':'Ruang siswa'}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stats(){return `<div class="grid stats">${[[role==='Guru'?'Tugas aktif':'Tugas untukmu',String(tasks.length),'Di semua kelas','▤'],[role==='Guru'?'Total siswa':'Sudah dikumpulkan',role==='Guru'?'84':'2','3 kelas terdaftar','♙'],[role==='Guru'?'Sudah mengumpulkan':'Menunggu dikumpulkan',role==='Guru'?'67':'1','Dari tugas aktif','↥'],[role==='Guru'?'Perlu diperiksa':'Tenggat terdekat','12',role==='Guru'?'Kiriman baru':'Hari ini · 20.00','◷']].map(x=>`<article class="card stat"><div class="stat-top">${x[0]}<span class="stat-icon">${x[3]}</span></div><div class="stat-value">${x[1]}</div><div class="stat-foot">${x[2]}</div></article>`).join('')}</div>`}
function taskCards(items=tasks){if(!items.length)return '<div class="empty">Belum ada tugas pada filter ini.</div>';return `<div class="task-list">${items.map(t=>{let pct=Math.round(t.submitted/t.total*100);return `<article class="task"><div class="task-icon">${t.kind.includes('Foto')?'🧪':'📄'}</div><div><h3>${t.title}</h3><p>${t.description}</p><div class="task-meta"><span class="pill blue">${t.className}</span><span class="pill">${t.subject}</span><span class="pill gold">⌛ ${t.due}</span></div>${role==='Guru'?`<div class="progress"><span style="width:${pct}%"></span></div><div class="progress-label"><span>${t.submitted} dari ${t.total} siswa sudah mengumpulkan</span><b>${pct}%</b></div>`:''}</div><div class="task-side"><b>${role==='Guru'?`${t.submitted}/${t.total}`:'Tugas aktif'}</b><small>${role==='Guru'?'terkumpul':''}</small><button class="btn soft small" data-task="${t.id}">${role==='Guru'?'Lihat tugas':'Buka tugas'}</button></div></article>`}).join('')}</div>`}
function home(){return header(role==='Guru'?'Selamat datang, Guru!':'Halo, Siswa!','Pantau kegiatan belajar dan pengumpulan tugas dari satu ruang kelas.',role==='Guru'?'<button class="btn primary" id="newTask">＋ Buat tugas</button>':'')+notice()+stats()+`<div class="grid columns"><section class="card"><div class="section-head"><div><h2>${role==='Guru'?'Tugas yang sedang berjalan':'Tugas untuk dikumpulkan'}</h2><p>Pembaruan dari kelas dan mata pelajaran</p></div><button class="textbtn" data-goto="tasks">Lihat semua →</button></div>${taskCards()}</section><aside class="card"><div class="section-head"><div><h2>Kelas & mata pelajaran</h2><p>Ruang belajar yang kamu ikuti</p></div><button class="textbtn" data-goto="classes">Semua →</button></div>${classList()}<div class="section-head" style="margin-top:19px"><div><h2>Aktivitas terbaru</h2><p>Contoh aktivitas hari ini</p></div></div>${activity()}</aside></div>`}
function classList(){return `<div class="class-list">${classes.map(c=>`<div class="classrow"><div class="classmark">${c.mark}</div><div><b>${c.name} · ${c.subject}</b><small>${role==='Guru'?`${c.students} siswa`:'Pengajar: Guru Demo'}</small></div><span class="count">›</span></div>`).join('')}</div>`}
function activity(){return `<div class="activity"><div class="event"><div class="event-mark">↥</div><div><b>Pengumpulan tugas baru</b><small>Matematika · 14.35</small></div></div><div class="event"><div class="event-mark">▤</div><div><b>Tugas baru dibagikan</b><small>Bahasa Indonesia · 10.20</small></div></div><div class="event"><div class="event-mark">✓</div><div><b>Umpan balik diberikan</b><small>IPA Terpadu · Kemarin</small></div></div></div>`}
function classesPage(){return header('Kelas & Mapel','Atur ruang belajar dan lihat jumlah siswa di setiap kelas.',role==='Guru'?'<button class="btn primary" data-toast="Penambahan kelas tersedia setelah backend diaktifkan.">＋ Tambah kelas</button>':'')+notice()+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${classes.map(c=>`<article class="card"><div class="classrow" style="border:0;padding:0"><div class="classmark" style="height:43px;width:43px;font-size:12px">${c.mark}</div><div><b>${c.name}</b><small>${c.subject}</small></div><button class="textbtn" data-toast="Ringkasan kelas demo dibuka.">•••</button></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:16px;padding-top:13px;color:var(--muted);font-size:9px"><span>Jumlah siswa</span><b style="color:var(--ink)">${c.students} siswa</b></div><div style="display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:9px"><span>Tugas aktif</span><b style="color:var(--ink)">${tasks.filter(t=>t.className===c.name).length} tugas</b></div><button class="btn ghost small" style="margin-top:14px;width:100%" data-class="${c.name}">Lihat ruang kelas</button></article>`).join('')}</div>`}
function tasksPage(){return header('Daftar Tugas','Instruksi, tenggat, dan progres pengumpulan tiap tugas.',role==='Guru'?'<button class="btn primary" id="newTask">＋ Buat tugas</button>':'')+notice()+`<section class="card"><div class="section-head"><div><h2>Semua tugas</h2><p>Pilih kelas untuk menyaring tugas</p></div><div class="filters">${['Semua','Kelas 7A','Kelas 8B','Kelas 9A'].map(x=>`<button class="filter ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div></div>${taskCards(filter==='Semua'?tasks:tasks.filter(t=>t.className===filter))}</section>`}
function submissionsPage(){return header(role==='Guru'?'Pengumpulan siswa':'Riwayat pengumpulan','Tinjau file yang dikirim dan lihat status pemeriksaan.',role==='Guru'?'<button class="btn" data-toast="Daftar pengumpulan demo siap ditinjau.">↓ Unduh rekap</button>':'')+notice()+`<div class="grid stats">${[['Total kiriman','67','Dari 3 kelas','↥'],['Menunggu diperiksa','12','Perlu tindak lanjut','◷'],['Sudah diperiksa','55','Pada tugas aktif','✓'],['Rata-rata pengumpulan','80%','Di semua kelas','▦']].map(x=>`<article class="card stat"><div class="stat-top">${x[0]}<span class="stat-icon">${x[3]}</span></div><div class="stat-value">${x[1]}</div><div class="stat-foot">${x[2]}</div></article>`).join('')}</div><section class="card"><div class="section-head"><div><h2>Kiriman terbaru</h2><p>Data demonstrasi siswa dan lampiran contoh</p></div><select class="filter" id="subFilter"><option>Semua kelas</option>${classes.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="tablewrap"><table class="table"><thead><tr><th>Siswa</th><th>Tugas</th><th>Kelas</th><th>Waktu</th><th>Lampiran</th><th>Status</th><th></th></tr></thead><tbody id="subRows">${submissionRows(submissions)}</tbody></table></div></section>`}
function submissionRows(rows){if(!rows.length)return '<tr><td colspan="7" class="empty">Belum ada kiriman untuk kelas ini.</td></tr>';return rows.map((s,i)=>`<tr><td><div class="student"><span class="avatar">${s.initial}</span><b>${s.student}</b></div></td><td>${s.task}</td><td>${s.className}</td><td>${s.time}</td><td>📎 ${s.file}</td><td><span class="pill ${s.state==='Sudah diperiksa'?'green':'gold'}">${s.state}</span></td><td><button class="btn soft small" data-review="${i}">${role==='Guru'?'Tinjau':'Detail'}</button></td></tr>`).join('')}
function openCreate(){document.getElementById('modalTitle').textContent='Bagikan tugas baru';document.getElementById('modalBody').innerHTML=`<form id="taskForm"><div class="formgrid"><div class="field full"><label>Judul tugas</label><input name="title" required placeholder="Contoh: Rangkuman Bab 2"></div><div class="field"><label>Kelas</label><select name="className">${classes.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="field"><label>Mata pelajaran</label><select name="subject">${[...new Set(classes.map(c=>c.subject))].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Tenggat pengumpulan</label><input type="datetime-local" name="due" required></div><div class="field"><label>Jenis lampiran</label><select name="kind"><option>Dokumen</option><option>Foto / dokumen</option><option>Foto</option></select></div><div class="field full"><label>Instruksi tugas</label><textarea name="description" required placeholder="Jelaskan apa yang perlu dikerjakan siswa..."></textarea></div><div class="field full"><label>Lampiran materi (opsional)</label><input type="file" aria-label="Pilih lampiran materi"><small style="color:var(--muted);font-size:8px">File hanya dipilih di browser demo dan tidak diunggah ke server.</small></div></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Batal</button><button class="btn primary">Simpan tugas demo</button></div></form>`;openModal();document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.currentTarget),c=classes.find(x=>x.name===d.get('className'));tasks.unshift({id:Date.now(),title:d.get('title'),subject:d.get('subject'),className:d.get('className'),due:'Tenggat: '+new Date(d.get('due')).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),description:d.get('description'),submitted:0,total:c.students,files:0,kind:d.get('kind'),status:'Berjalan'});closeModal();render();toast('Tugas contoh berhasil ditambahkan.');}}
function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('cancelModal')?.addEventListener('click',closeModal)}function closeModal(){document.getElementById('modal').classList.remove('open')}
function openTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;document.getElementById('modalTitle').textContent=role==='Guru'?'Ringkasan tugas':'Kumpulkan tugas';document.getElementById('modalBody').innerHTML=`<div class="notice"><span>ℹ</span><span>Tampilan simulasi, file dan perubahan tidak tersimpan ke server.</span></div><h3 style="font-size:13px;margin:13px 0 5px">${t.title}</h3><p style="font-size:10px;color:var(--muted);margin:0 0 12px">${t.className} · ${t.subject} · ${t.due}</p><div class="card" style="box-shadow:none;padding:13px;font-size:10px;line-height:1.7">${t.description}</div>${role==='Siswa'?`<form id="uploadForm"><div class="field" style="margin-top:13px"><label>Unggah jawaban foto atau dokumen</label><div class="upload">📎 Pilih file dari perangkat<input type="file" name="files" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx" multiple></div></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Kembali</button><button class="btn primary">Kirim tugas demo</button></div></form>`:`<div class="progress"><span style="width:${Math.round(t.submitted/t.total*100)}%"></span></div><div class="progress-label"><span>Progres pengumpulan</span><b>${t.submitted}/${t.total} siswa</b></div><div class="modal-actions"><button class="btn ghost" id="cancelModal">Tutup</button><button class="btn soft" data-goto="submissions">Lihat kiriman</button></div>`}`;openModal();document.getElementById('uploadForm')?.addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget.files?.[0]||document.querySelector('#uploadForm input[type=file]').files?.[0];if(!f){toast('Pilih berkas terlebih dahulu.');return}submissions.unshift({student:'Siswa Demo',initial:'SD',task:t.title,className:t.className,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),file:f.name,state:'Menunggu diperiksa'});t.submitted=Math.min(t.total,t.submitted+1);closeModal();render();toast('Kiriman demo ditambahkan. Berkas tidak dikirim ke server.')})}
function render(){view.innerHTML=({home,tasks:tasksPage,classes:classesPage,submissions:submissionsPage})[page]();document.getElementById('crumb').textContent=names[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('profileAvatar').textContent=role==='Guru'?'GR':'SD';document.getElementById('profileName').textContent=role==='Guru'?'Guru Demo':'Siswa Demo';document.getElementById('profileRole').textContent=role==='Guru'?'Pengajar · Akun simulasi':'Peserta didik · Akun simulasi';wire()}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function wire(){view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));view.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});view.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));view.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.task)));view.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{filter=b.dataset.class;go('tasks')});view.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>toast('Rincian lampiran hanya contoh; backend belum diaktifkan.'));document.getElementById('newTask')?.addEventListener('click',openCreate);document.getElementById('subFilter')?.addEventListener('change',e=>document.getElementById('subRows').innerHTML=submissionRows(e.target.value==='Semua kelas'?submissions:submissions.filter(s=>s.className===e.target.value)))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('roleSelect').onchange=e=>{role=e.target.value;render();toast('Pratinjau peran '+role+' aktif.')};document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script>
</body></html>
