function lineChart(labels,series,{max,h=190}={}){
  const W=560,L=34,R=10,T=10,B=24,all=series.flatMap(s=>s.data),mx=max||Math.max(1,...all)*1.12;
  const x=i=>L+(labels.length<2?0:i*(W-L-R)/(labels.length-1)),y=v=>T+(h-T-B)*(1-v/mx);
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${L-5}" y="${y(v)+3}" font-size="9" fill="#94a3b8" text-anchor="end">${Math.round(v)}</text>`}
  const lb=labels.map((l,i)=>`<text x="${x(i)}" y="${h-8}" font-size="9" fill="#64748b" text-anchor="middle">${l}</text>`).join('');
  const ls=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.4" points="${s.data.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"><title>${s.name}: ${v}</title></circle>`).join('')).join('');
  return`<svg viewBox="0 0 ${W} ${h}" class="w-full">${g}${lb}${ls}</svg>`+legend(series)}
function barChart(labels,series,{h=190,fmt=v=>v}={}){
  const W=560,L=40,R=10,T=10,B=24,mx=Math.max(1,...series.flatMap(s=>s.data))*1.12,y=v=>T+(h-T-B)*(1-v/mx),gw=(W-L-R)/labels.length,bw=Math.min(28,gw*.7/series.length);
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${L-5}" y="${y(v)+3}" font-size="9" fill="#94a3b8" text-anchor="end">${fmt(Math.round(v))}</text>`}
  const bars=labels.map((l,i)=>{const cx=L+gw*i+gw/2;return series.map((s,k)=>{const x=cx-bw*series.length/2+k*bw,yy=y(s.data[i]);return`<rect x="${x}" y="${yy}" width="${bw-2}" height="${h-B-yy}" rx="3" fill="${s.color}"><title>${s.name} ${l}: ${fmt(s.data[i])}</title></rect>`}).join('')+`<text x="${cx}" y="${h-8}" font-size="9" fill="#64748b" text-anchor="middle">${l}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${h}" class="w-full">${g}${bars}</svg>`+legend(series)}
const legend=s=>s.length>1||s[0]?.name?`<div class="flex flex-wrap gap-3 text-[11px] text-slate-600 mt-1">${s.map(x=>`<span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm inline-block" style="background:${x.color}"></i>${x.name}</span>`).join('')}</div>`:'';
const hbars=(items,f=v=>v,mx)=>{const m=mx||Math.max(1,...items.map(i=>i.value));return items.map(i=>`<div class="mb-2.5"><div class="flex justify-between text-xs mb-1"><span class="font-semibold text-slate-700">${esc(i.label)}</span><span class="text-slate-500">${f(i.value)}${i.sub?' · '+i.sub:''}</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100,i.value*100/m)}%;background:${i.color||'#2563eb'}"></div></div></div>`).join('')};

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('file-invoice','Total Tagihan',rp(tot),all.length+' tagihan')}${kpi('circle-check','Terbayar',rp(paid),pct(paid,tot)+'% dari tagihan','emerald')}${kpi('hourglass-half','Verifikasi',ver.length,rp(sum(ver.map(net))),'amber')}${kpi('triangle-exclamation','Tunggakan',rp(sum(over.map(net))),over.length+' tagihan lewat jatuh tempo','red')}</div>
  <div class="card p-3 flex flex-wrap gap-2"><input id="q" class="inp !w-auto flex-1 min-w-[150px]" placeholder="Cari siswa…" value="${esc(UI.q)}" oninput="UI.q=this.value;render()"><select class="inp !w-auto" onchange="UI.f.is=this.value;render()"><option value="">Semua status</option>${['Lunas','Verifikasi','Menunggak','Belum bayar'].map(x=>`<option ${f.is===x?'selected':''}>${x}</option>`).join('')}</select></div>

function genInvoices(){const nm=MONTHS[MONTHS.length-1];const next=nm==='2026-11'?'2026-12':nm;if(!MONTHS.includes('2026-12'))MONTHS.push('2026-12');let n=0;
  stuS().filter(s=>s.status==='Aktif').forEach(s=>{if(DB.invoices.some(i=>i.studentId===s.id&&i.month==='2026-12'))return;DB.invoices.push({id:'inv_'+s.id+'_2026-12',studentId:s.id,month:'2026-12',amount:DB.levels.find(l=>l.id===s.level).fee,discount:0,due:'2026-12-10',status:'unpaid',paidAt:null,method:null,proof:null,reminded:0});n++;notify(['par:'+s.parent],`Tagihan SPP Desember ${s.name} tersedia, jatuh tempo 10 Des.`,'file-invoice-dollar')});
  UI.month='2026-12';save();render();toast(n?`${n} tagihan Desember dibuat otomatis`:'Tagihan Desember sudah dibuat sebelumnya')}
function remind(id,quiet){const i=DB.invoices.find(x=>x.id===id);i.reminded=(i.reminded||0)+1;notify(['par:'+stu(i.studentId).parent],`Pengingat: SPP ${fm(i.month)} ${stu(i.studentId).name} ${rp(net(i))} belum dibayar.`,'bell');save();setTimeout(render,50)}
function remindAll(){const l=invS().filter(i=>invSt(i)==='Menunggak');if(!l.length){toast('Tidak ada tunggakan');return}l.forEach(i=>{i.reminded=(i.reminded||0)+1;notify(['par:'+stu(i.studentId).parent],`Pengingat WhatsApp: SPP ${fm(i.month)} ${stu(i.studentId).name} telah jatuh tempo.`,'bell')});save();render();toast(l.length+' pengingat WhatsApp terkirim (simulasi gateway)')}
function verify(id){const i=DB.invoices.find(x=>x.id===id);i.status='paid';i.paidAt=TODAY;notify(['par:'+stu(i.studentId).parent],`Pembayaran SPP ${fm(i.month)} ${stu(i.studentId).name} terverifikasi. Terima kasih!`,'circle-check');save();render();toast('Pembayaran diverifikasi')}
function rejectPay(id){const i=DB.invoices.find(x=>x.id===id);i.status='unpaid';i.proof=null;i.method=null;notify(['par:'+stu(i.studentId).parent],`Bukti pembayaran SPP ${fm(i.month)} ditolak. Mohon unggah ulang bukti yang jelas.`,'circle-xmark');save();render();toast('Bukti ditolak')}

  PAY.sel=PAY.sel.filter(id=>open.some(i=>i.id===id));const chosen=open.filter(i=>PAY.sel.includes(i.id)),sub=sum(chosen.map(i=>i.amount)),cp=PAY.cv,disc=cp?(cp.kind==='pct'?Math.round(sub*cp.value/100):Math.min(cp.value,sub)):0;
  return`${childBar()}<h2 class="text-xl font-extrabold">Tagihan & Pembayaran SPP</h2><div class="grid lg:grid-cols-5 gap-4"><div class="lg:col-span-3 card scroll-x"><table class="t"><thead><tr><th></th><th>Bulan</th><th>Jumlah</th><th>Jatuh tempo</th><th>Status</th><th></th></tr></thead><tbody>${iv.map(i=>`<tr><td>${i.status==='unpaid'?`<input type="checkbox" ${PAY.sel.includes(i.id)?'checked':''} onchange="togSel('${i.id}')">`:''}</td><td class="font-bold">SPP ${fm(i.month)}</td><td>${rp(net(i))}</td><td>${fd(i.due)}</td><td>${bdg(invSt(i),invCol(i))}</td><td>${i.status==='paid'?`<button class="btn btn-o btn-s" onclick="receipt('${i.id}')"><i class="fa-solid fa-receipt"></i>Kuitansi</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  <div class="lg:col-span-2 card p-4 h-fit space-y-3"><div class="font-extrabold text-sm">Pembayaran</div>${chosen.length?`<div class="text-xs space-y-1">${chosen.map(i=>`<div class="flex justify-between"><span>SPP ${fm(i.month)}</span><b>${rp(i.amount)}</b></div>`).join('')}</div><form class="flex gap-2" onsubmit="event.preventDefault();applyCoupon(this.cp.value,'spp')"><input name="cp" class="inp uppercase" placeholder="Kode kupon" value="${esc(PAY.coupon)}"><button class="btn btn-o">Pakai</button></form>${cp?`<div class="text-xs text-green-600 font-bold">Kupon ${cp.code}: −${rp(disc)}</div>`:''}<div class="flex justify-between border-t pt-2 font-extrabold"><span>Total</span><span>${rp(sub-disc)}</span></div><div class="grid gap-1.5">${['QRIS','Virtual Account','Transfer Manual'].map(m=>`<label class="border rounded-xl px-3 py-2 text-xs font-bold flex items-center gap-2 cursor-pointer ${PAY.method===m?'border-brand-600 bg-brand-50':''}"><input type="radio" name="pm" ${PAY.method===m?'checked':''} onchange="PAY.method='${m}';render()">${m}</label>`).join('')}</div><button class="btn btn-p w-full justify-center py-2.5" onclick="payNow()">Bayar ${rp(sub-disc)}</button>`:'<div class="text-xs text-slate-400">Centang tagihan yang ingin dibayar.</div>'}</div></div>`}
function togSel(id){PAY.sel=PAY.sel.includes(id)?PAY.sel.filter(x=>x!==id):[...PAY.sel,id];PAY.cv=null;PAY.coupon='';render()}
function applyCoupon(code,kind){code=code.trim().toUpperCase();PAY.coupon=code;const c=DB.coupons.find(x=>x.code===code);
  if(!c||!c.active||c.exp<TODAY||c.used>=c.quota||!(c.applies==='all'||c.applies===kind)){PAY.cv=null;toast('Kupon tidak valid / tidak berlaku');}else{PAY.cv=c;toast('Kupon diterapkan')}render()}
function payNow(){const s=curChild(),chosen=DB.invoices.filter(i=>PAY.sel.includes(i.id)),sub=sum(chosen.map(i=>i.amount)),cp=PAY.cv,disc=cp?(cp.kind==='pct'?Math.round(sub*cp.value/100):Math.min(cp.value,sub)):0,tot=sub-disc,m=PAY.method;
  const qr=Array.from({length:225},(_,i)=>((i*7+(i>>4)*3)%5<2)?`<rect x="${(i%15)*8}" y="${Math.floor(i/15)*8}" width="8" height="8"/>`:'').join('');
  const box=m==='QRIS'?`<svg viewBox="0 0 120 120" class="w-44 h-44 mx-auto border p-1.5 rounded-xl bg-white">${qr}</svg><p class="text-xs text-center text-slate-500 mt-2">Scan dengan e-wallet / m-banking apa pun.</p>`:m==='Virtual Account'?`<div class="text-center bg-slate-50 rounded-xl p-5"><div class="text-xs text-slate-500">Virtual Account BCA</div><div class="text-2xl font-extrabold tracking-widest mt-1">8077 ${s.id.replace(/\D/g,'').padStart(4,'0')} 2026</div></div>`:`<div class="text-xs bg-slate-50 rounded-xl p-4">Transfer ke <b>BCA 123-456-7890 a.n. Briton & Oxford Academy</b>, lalu unggah bukti transfer.<input type="file" id="proofFile" accept="image/*" class="inp mt-3"></div>`;
  modal('Selesaikan Pembayaran',`<div class="text-center mb-3"><div class="text-xs text-slate-500">Total pembayaran</div><div class="text-3xl font-extrabold">${rp(tot)}</div></div>${box}<button class="btn btn-g w-full justify-center py-2.5 mt-4" onclick="confirmPay(${disc})">${m==='Transfer Manual'?'Kirim Bukti Pembayaran':'Simulasikan Pembayaran Berhasil'}</button>`)}
function confirmPay(disc){const m=PAY.method;let proof=null;if(m==='Transfer Manual'){const f=$('proofFile');if(!f||!f.files[0]){toast('Unggah bukti transfer terlebih dahulu');return}proof=f.files[0].name}
  const ch=DB.invoices.filter(i=>PAY.sel.includes(i.id));ch.forEach((i,k)=>{i.method=m;if(k===0)i.discount=disc;if(m==='Transfer Manual'){i.status='verifikasi';i.proof=proof}else{i.status='paid';i.paidAt=TODAY}});
  if(PAY.cv)PAY.cv.used++;const s=curChild();notify(['cab:'+s.branch],m==='Transfer Manual'?`Bukti bayar baru dari ${s.name} perlu diverifikasi.`:`Pembayaran SPP ${s.name} via ${m} diterima.`,'receipt');
  notify(['par:'+U().id],m==='Transfer Manual'?'Bukti pembayaran terkirim, menunggu verifikasi admin.':'Pembayaran berhasil. Kuitansi tersedia di menu Tagihan.','circle-check');
  PAY={sel:[],coupon:'',method:'QRIS',cv:null};closeModal();save();render();toast(m==='Transfer Manual'?'Bukti terkirim, menunggu verifikasi':'Pembayaran berhasil ✓')}

function parentProg(){const s=curChild(),r=stuReps(s.id),a=stuAtt(s.id),f=forecast(s),last=r.slice(-3);
  if(!r.length)return childBar()+'<div class="card p-6 text-sm text-slate-500">Belum ada laporan perkembangan.</div>';
  const sk=[['Fluency','fluency'],['Pronunciation','pron'],['Vocabulary','vocab']].map(([l,k])=>({label:l,value:Math.round(avg(last.map(x=>x[k]))),color:'#2563eb'}));
  const rec=r.slice(-12);
  return`${childBar()}<div class="flex justify-between items-center"><h2 class="text-xl font-extrabold">Perkembangan ${esc(s.name.split(' ')[0])}</h2><button class="btn btn-o" onclick="printReport()"><i class="fa-solid fa-print"></i>Cetak Rapor</button></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('percent','Kehadiran',a.p+'%',a.h+' dari '+a.total+' pertemuan','emerald')}${kpi('star','Rata² Nilai',Math.round(avg(r.map(x=>x.score))),'seluruh pertemuan')}${kpi('microphone','Speaking',r[r.length-1].speaking,'naik '+(r[r.length-1].speaking-r[0].speaking)+' poin sejak awal','rose')}${kpi('graduation-cap','Lulus Level',fd(f.date).slice(5),'Wisuda '+fd(f.wisuda).slice(5),'amber')}</div>
  <div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2">${sec('Grafik Nilai & Speaking Progress',lineChart(rec.map(x=>x.date.slice(8)+'/'+x.date.slice(5,7)),[{name:'Nilai',color:'#1d4ed8',data:rec.map(x=>x.score)},{name:'Speaking',color:'#f59e0b',data:rec.map(x=>x.speaking)}],{max:100}))}</div>${sec('Skill Speaking (3 pertemuan terakhir)',hbars(sk,v=>v+'/100',100))}</div>
  ${sec('Materi & Nilai Setiap Pertemuan',`<div class="scroll-x"><table class="t"><thead><tr><th>Tanggal</th><th>Materi</th><th>Nilai</th><th>Speaking</th><th>Catatan Tutor</th></tr></thead><tbody>${r.slice().reverse().slice(0,15).map(x=>`<tr><td class="whitespace-nowrap">${fd(x.date)}</td><td class="font-bold">${esc(x.material)}</td><td>${bdg(x.score,x.score>=80?'green':x.score>=70?'amber':'red')}</td><td>${x.speaking}</td><td class="text-slate-500">${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`)}<div id="rapor" class="hidden"></div>`}
function printReport(){const s=curChild(),r=stuReps(s.id),a=stuAtt(s.id),f=forecast(s);modal('Rapor Perkembangan',`<div id="printArea" class="border-2 border-slate-800 rounded-xl p-5 text-sm"><div class="text-center border-b-2 border-slate-800 pb-2 mb-3"><div class="font-extrabold text-lg">Briton & Oxford Academy</div><div class="text-xs">Rapor Perkembangan Siswa</div></div><div class="grid grid-cols-2 gap-1 text-xs mb-3"><div>Nama: <b>${esc(s.name)}</b></div><div>Level: <b>${lvn(s.level)}</b></div><div>Kelas: <b>${cls(s.classId).name}</b></div><div>Cabang: <b>${bn(s.branch)}</b></div></div><table class="w-full text-xs"><tr class="border-b"><td class="py-1.5">Kehadiran</td><td class="text-right font-bold">${a.p}%</td></tr><tr class="border-b"><td class="py-1.5">Rata-rata nilai</td><td class="text-right font-bold">${Math.round(avg(r.map(x=>x.score)))}</td></tr><tr class="border-b"><td class="py-1.5">Speaking rata-rata</td><td class="text-right font-bold">${Math.round(avg(r.map(x=>x.speaking)))}</td></tr><tr class="border-b"><td class="py-1.5">Perkiraan lulus level</td><td class="text-right font-bold">${fd(f.date)}</td></tr><tr><td class="py-1.5">Wisuda</td><td class="text-right font-bold">${fd(f.wisuda)}</td></tr></table><p class="text-xs mt-3 italic">Catatan tutor: ${esc(r[r.length-1]?.note||'-')}</p></div><div class="mt-3 text-right"><button class="btn btn-p" onclick="window.print()"><i class="fa-solid fa-print"></i>Cetak</button></div>`)}

let CART={q:1,coupon:'',cv:null};
function parentShop(){const s=curChild(),b=s.branch;
  return`${childBar()}<h2 class="text-xl font-extrabold">Katalog Produk & Jasa</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${DB.products.map(p=>{const st=p.stock?p.stock[b]:null;return`<div class="card p-4 flex flex-col"><div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center text-xl"><i class="fa-solid fa-${p.icon}"></i></div><div class="font-extrabold mt-3 text-sm">${p.name}</div><div class="text-xs text-slate-500">${p.type}${st!==null?' · stok '+st:''}</div><div class="font-extrabold text-lg mt-2 flex-1">${rp(p.price)}</div><button class="btn btn-p mt-3 justify-center" ${st===0?'disabled style="opacity:.5"':''} onclick="buyForm('${p.id}')">${st===0?'Stok habis':'Beli'}</button></div>`}).join('')}</div>
  ${sec('Pesanan Saya',DB.orders.filter(o=>o.parent===U().id).map(o=>`<div class="flex justify-between text-sm py-1.5 border-b border-slate-50"><span>${esc(o.item)} ×${o.qty} <span class="text-[11px] text-slate-400">${fd(o.date)}</span></span><span>${rp(o.total)} ${bdg(o.status,o.status==='Selesai'?'green':'amber')}</span></div>`).join('')||'<div class="text-xs text-slate-400">Belum ada pesanan.</div>')}`}
function buyForm(id){const p=DB.products.find(x=>x.id===id);CART={q:1,coupon:'',cv:null,id};buyModal()}
function buyModal(){const p=DB.products.find(x=>x.id===CART.id),b=curChild().branch,sub=p.price*CART.q,cp=CART.cv,disc=cp?(cp.kind==='pct'?Math.round(sub*cp.value/100):Math.min(cp.value,sub)):0;
  modal('Beli '+p.name,`<div class="space-y-3"><div class="flex items-center justify-between"><span class="text-sm font-bold">Jumlah</span><span class="flex items-center gap-2"><button class="btn btn-o btn-s" onclick="CART.q=Math.max(1,CART.q-1);buyModal()">−</button><b>${CART.q}</b><button class="btn btn-o btn-s" onclick="CART.q=Math.min(${p.stock?p.stock[b]:9},CART.q+1);buyModal()">+</button></span></div><form class="flex gap-2" onsubmit="event.preventDefault();cartCoupon(this.cp.value)"><input name="cp" class="inp uppercase" placeholder="Kode kupon (mis. BUKU20)" value="${esc(CART.coupon)}"><button class="btn btn-o">Pakai</button></form>${cp?`<div class="text-xs text-green-600 font-bold">Kupon ${cp.code}: −${rp(disc)}</div>`:''}<div class="flex justify-between font-extrabold border-t pt-2"><span>Total</span><span>${rp(sub-disc)}</span></div><button class="btn btn-g w-full justify-center py-2.5" onclick="checkout(${disc})"><i class="fa-solid fa-qrcode"></i>Bayar via QRIS (simulasi)</button></div>`)}
function cartCoupon(code){code=code.trim().toUpperCase();CART.coupon=code;const c=DB.coupons.find(x=>x.code===code);if(!c||!c.active||c.exp<TODAY||c.used>=c.quota||!(c.applies==='all'||c.applies==='product')){CART.cv=null;toast('Kupon tidak valid / tidak berlaku untuk produk')}else{CART.cv=c;toast('Kupon diterapkan')}buyModal()}
function checkout(disc){const p=DB.products.find(x=>x.id===CART.id),s=curChild();if(p.stock)p.stock[s.branch]-=CART.q;if(CART.cv)CART.cv.used++;
  DB.orders.unshift({id:uid('o'),date:TODAY,who:s.name,parent:U().id,item:p.name,qty:CART.q,branch:s.branch,total:p.price*CART.q-disc,status:'Diproses'});notify(['cab:'+s.branch],`Pesanan baru: ${p.name} ×${CART.q} (${s.name}).`,'bag-shopping');closeModal();save();render();toast('Pesanan berhasil dibayar ✓')}

function parentBook(){const s=curChild(),mine=DB.bookings.filter(b=>b.studentId===s.id||b.parent===U().id).sort((a,b)=>a.date<b.date?-1:1);
  return`${childBar()}<div class="flex justify-between items-center"><h2 class="text-xl font-extrabold">Booking Jadwal</h2><button class="btn btn-p" onclick="bookForm()"><i class="fa-solid fa-plus"></i>Buat Booking</button></div><div class="card scroll-x"><table class="t"><thead><tr><th>Jenis</th><th>Siswa</th><th>Cabang</th><th>Jadwal</th><th>Status</th></tr></thead><tbody>${mine.map(b=>`<tr><td class="font-bold">${b.type}</td><td>${esc(b.who)}</td><td>${bn(b.branch)}</td><td>${fd(b.date)} · ${b.time}</td><td>${bdg(b.status,b.status==='Dikonfirmasi'?'green':b.status==='Ditolak'?'red':'amber')}</td></tr>`).join('')||'<tr><td colspan="5" class="text-center py-6 text-slate-400">Belum ada booking</td></tr>'}</tbody></table></div>`}
function bookForm(){const s=curChild();formModal('Buat Booking',sel('Jenis','type',['Kelas Pengganti','Private','Trial Class (teman/saudara)'].map(x=>[x,x]))+`<div class="grid grid-cols-2 gap-2">${sel('Cabang','branch',DB.branches.map(b=>[b.id,b.name]),s.branch)}${fld('Tanggal','date',addD(TODAY,3),'date',`min="${addD(TODAY,1)}" required`)}</div>${sel('Jam','time',['09:00','10:00','13:00','15:00','16:00','17:00','18:00'].map(x=>[x,x]),'16:00')}${fld('Catatan','note','')}`,o=>{DB.bookings.push({id:uid('bk'),type:o.type,who:s.name,branch:o.branch,date:o.date,time:o.time,status:'Menunggu',note:o.note,studentId:s.id,parent:U().id});notify(['cab:'+o.branch],`Booking ${o.type} baru dari ${s.name} untuk ${fd(o.date)}.`,'calendar-plus');toast('Booking terkirim, menunggu konfirmasi')},'Kirim')}
function parentChat(){const s=curChild(),b=DB.branches.find(x=>x.id===s.branch),c=cls(s.classId),t=tut(c.tutor),pu=DB.branches[0];
  const card=(icon,title,sub,phone,msg)=>`<a target="_blank" href="${wa(phone,msg)}" class="card p-4 flex items-center gap-3 hover:border-green-500"><span class="w-12 h-12 rounded-2xl bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="fa-brands fa-whatsapp"></i></span><div class="flex-1"><div class="font-extrabold text-sm">${title}</div><div class="text-xs text-slate-500">${sub}</div></div><i class="fa-solid fa-chevron-right text-slate-300"></i></a>`;
  return`${childBar()}<h2 class="text-xl font-extrabold">Hubungi via WhatsApp</h2><div class="grid md:grid-cols-2 gap-3">${card('','Admin Cabang '+b.name,'Tagihan, jadwal, administrasi',b.wa,'Halo Admin '+b.name+', saya orang tua dari '+s.name+'. ')}${card('','Tutor '+t.name,'Kelas '+c.name+' — perkembangan belajar',t.phone,'Halo Kak '+t.name+', saya orang tua dari '+s.name+'. ')}${card('','Admin Pusat','Pendaftaran, pindah cabang, keluhan',pu.wa,'Halo Admin Pusat, saya orang tua dari '+s.name+'. ')}</div>`}

const VIEW_FN={dash:dashView,branches:branchesView,students:studentsView,classes:classesView,tutors:tutorsView,attendance:attendanceView,billing:billingView,payroll:payrollView,info:infoView,stock:stockView,booking:bookingView,t_today:tutorToday,t_class:tutorClass,t_pay:tutorPay,p_home:parentHome,p_pay:parentPay,p_prog:parentProg,p_shop:parentShop,p_book:parentBook,p_chat:parentChat};
render();
</script>
