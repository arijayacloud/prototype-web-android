<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Prototipe aplikasi operasional multi-cabang untuk absensi, anggaran, kegiatan, inventori, dan laporan.">
  <title>RuangKerja — Operasional Cabang</title>
  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
    .sidebar{background:var(--navy);color:#dbe4f4;padding:22px 15px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#7fa0ff,#4866f2);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 14px #101c3777}.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}.brand small{color:#a8b8d5;font-size:11px}.nav-group{display:grid;gap:5px}.nav-label{color:#8b9bb8;text-transform:uppercase;letter-spacing:1.15px;font-size:10px;font-weight:750;padding:0 12px 5px}.nav-item{border:0;background:transparent;color:#c4cfe2;padding:10px 12px;border-radius:11px;display:flex;gap:11px;align-items:center;text-align:left;font-weight:570;transition:.15s}.nav-item:hover{background:#ffffff0e;color:#fff}.nav-item.active{color:#fff;background:#3855aa}.nav-icon{width:20px;text-align:center;font-size:16px;opacity:.9}.nav-spacer{flex:1}.sidebar-note{background:#ffffff0b;border:1px solid #ffffff16;border-radius:14px;padding:13px;color:#c1cee4;font-size:11px;line-height:1.55}.sidebar-note b{color:#fff;display:block;margin-bottom:5px}.user-mini{padding:11px 9px 2px;border-top:1px solid #ffffff1a;display:flex;align-items:center;gap:10px}.avatar{height:35px;width:35px;border-radius:50%;display:grid;place-items:center;background:#e5eaff;color:#425dd3;font-weight:800;flex:none}.user-mini b{display:block;color:#fff;font-size:12px}.user-mini small{color:#9fb0cd;font-size:10px}
    .main{min-width:0}.topbar{height:76px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:11px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;color:#53617b;display:grid;place-items:center}.role-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.role-wrap select,.branch-select{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 12px;font-weight:650;outline:none}.role-wrap select{font-size:12px}.mobile-menu{display:none}
    .content{max-width:1500px;margin:auto;padding:28px 34px 48px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}.page-heading h1{font-size:27px;letter-spacing:-.7px;margin:0 0 5px}.page-heading p{margin:0;color:var(--muted);font-size:13px}.heading-right{display:flex;align-items:center;gap:9px}.date-pill{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:#526079;font-size:12px}.primary,.secondary,.quiet{border:0;border-radius:11px;padding:10px 14px;font-weight:700;transition:transform .12s,background .12s}.primary{background:var(--blue);color:#fff;box-shadow:0 5px 12px #4268f533}.primary:hover{background:#3458e4;transform:translateY(-1px)}.secondary{background:var(--blue-soft);color:#3f5fd4}.quiet{background:#f3f5f9;color:#526079}.small{padding:7px 10px;font-size:11px}
    .notice{background:#fff9ed;border:1px solid #f3e1bd;color:#765723;border-radius:13px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;font-size:11px;margin-bottom:18px}.notice strong{color:#624611}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:19px;min-width:0}.stat-card{padding:17px 19px;position:relative;overflow:hidden}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:650}.stat-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);font-size:15px}.stat-value{font-size:28px;font-weight:780;letter-spacing:-1px;margin:11px 0 4px}.stat-foot{font-size:10px;color:var(--muted)}.trend{color:var(--green);font-weight:750}.main-grid{grid-template-columns:minmax(0,1.55fr) minmax(290px,.85fr);align-items:start}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 15px}.section-title h2{font-size:15px;margin:0;letter-spacing:-.2px}.section-title p{font-size:11px;color:var(--muted);margin:3px 0 0}.link-btn{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700;padding:4px}.chart-card{min-height:310px}.chart-head{display:flex;justify-content:space-between;align-items:start}.chart-legend{display:flex;gap:12px;color:var(--muted);font-size:10px}.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:5px}.legend-dot.two{background:#37b789}.chart{margin-top:17px;height:195px;display:flex;gap:13px;align-items:flex-end;border-bottom:1px solid var(--line);padding:0 6px 0 34px;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#eef0f5 48px,#eef0f5 49px)}.chart::before{content:"100%\A 75%\A 50%\A 25%";white-space:pre;position:absolute;left:0;top:0;color:#a0aabb;font-size:9px;line-height:48px}.bar-group{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative}.bar{width:clamp(8px,28%,18px);border-radius:5px 5px 0 0;background:linear-gradient(#7b94ff,#4268f5);min-height:5px}.bar.green{background:linear-gradient(#77ddba,#37b789)}.bar-label{position:absolute;bottom:-19px;color:#8792a4;font-size:9px;white-space:nowrap}.chart-caption{font-size:10px;color:#9aa4b4;margin-top:25px}
    .activity-list{display:grid;gap:0}.activity{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #f0f1f5}.activity:last-child{border-bottom:0;padding-bottom:0}.activity-mark{width:30px;height:30px;border-radius:10px;background:#eef1ff;display:grid;place-items:center;flex:none}.activity-text{min-width:0;flex:1}.activity-text b{font-size:11px;display:block;font-weight:700}.activity-text small{font-size:10px;color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;font-size:9px;font-weight:750;white-space:nowrap;background:#eef1f6;color:#657086}.status::before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}.status.ok{background:#e7f8ef;color:#248760}.status.wait{background:#fff4df;color:#a66b12}.status.info{background:#edf1ff;color:#526de0}.status.bad{background:#ffeded;color:#b94b53}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#929cad;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:10px 9px;border-bottom:1px solid var(--line)}.table td{padding:12px 9px;border-bottom:1px solid #f0f1f5;font-size:11px}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:8px}.person .avatar{width:28px;height:28px;font-size:9px}.person b{font-size:11px}.person small{display:block;color:var(--muted);font-size:9px}.approval-list{display:grid;gap:10px}.approval{padding:12px;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:10px}.approval .approval-body{flex:1;min-width:0}.approval b{font-size:11px;display:block}.approval small{font-size:10px;color:var(--muted)}.approval-actions{display:flex;gap:5px}.approval-actions button{border:0;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:700}.approve{color:var(--green);background:#e8f8ef}.reject{color:var(--red);background:#fff0f0}
    .quick-grid{grid-template-columns:repeat(4,1fr);margin-top:17px}.quick-action{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;transition:.15s}.quick-action:hover{border-color:#b9c6ff;transform:translateY(-2px);box-shadow:var(--shadow)}.quick-action i{font-style:normal;width:35px;height:35px;border-radius:11px;background:#f0f3ff;display:grid;place-items:center;font-size:16px}.quick-action b{display:block;font-size:11px}.quick-action small{color:var(--muted);font-size:10px}
    .panel-grid{grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);align-items:start}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#66738a;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8da1ff;box-shadow:0 0 0 3px #4268f51a}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.check-list{display:grid;gap:9px}.check-row{display:flex;align-items:center;gap:9px;font-size:11px;color:#4e5b71}.check-row input{accent-color:var(--blue);width:15px;height:15px}.progress{height:8px;border-radius:99px;background:#edf0f5;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#4268f5,#8d9fff);border-radius:99px}.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:7px 0 13px}.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{padding:13px;border:1px solid var(--line);border-radius:13px}.kpi small{font-size:9px;color:var(--muted)}.kpi b{display:block;font-size:19px;margin-top:5px}.branch-cards{grid-template-columns:repeat(4,minmax(0,1fr))}.branch-card{border:1px solid var(--line);border-radius:14px;padding:15px}.branch-card b{font-size:11px;display:block}.branch-card small{color:var(--muted);font-size:10px}.branch-card .progress{margin-top:12px}
    .toast{position:fixed;right:24px;bottom:23px;background:#1d2d45;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 14px 30px #17203333;font-size:12px;z-index:20;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.empty{text-align:center;color:var(--muted);padding:32px 12px;font-size:12px}.footer-note{color:#a0a9b8;font-size:10px;text-align:center;margin:25px 0 0}.hidden{display:none!important}
    @media(max-width:1100px){.app{grid-template-columns:215px minmax(0,1fr)}.sidebar{padding-inline:11px}.content{padding-inline:24px}.topbar{padding-inline:24px}.stats{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}.branch-cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:15;left:0;top:0;width:255px;transform:translateX(-105%);transition:transform .22s;box-shadow:0 10px 35px #111d3855}.sidebar.open{transform:translateX(0)}.topbar{height:63px;padding:0 15px}.mobile-menu{display:grid}.crumb{margin-right:auto;margin-left:10px}.role-wrap>span{display:none}.role-wrap select{max-width:130px;padding:8px}.content{padding:22px 15px 36px}.page-heading{align-items:flex-start;flex-direction:column}.page-heading h1{font-size:24px}.heading-right{width:100%;justify-content:space-between}.main-grid,.panel-grid{grid-template-columns:1fr}.stats{gap:10px}.stat-card{padding:14px}.stat-value{font-size:24px}.card{padding:16px;border-radius:15px}.chart-card{min-height:290px}.quick-grid{gap:9px}.quick-action{padding:11px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{min-width:610px}.branch-cards{grid-template-columns:repeat(2,1fr)}.toast{right:12px;bottom:12px;left:12px;text-align:center}}
    @media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.stat-head{font-size:10px}.quick-action{gap:7px}.quick-action i{width:30px;height:30px}.branch-cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">R</div><div><b>RuangKerja</b><small>OPERASIONAL CABANG</small></div></div>
    <nav class="nav-group" aria-label="Navigasi utama">
      <div class="nav-label">Menu</div>
      <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Ringkasan</button>
      <button class="nav-item" data-page="attendance"><span class="nav-icon">◷</span>Absensi</button>
      <button class="nav-item" data-page="requests"><span class="nav-icon">⇧</span>Pengajuan</button>
      <button class="nav-item" data-page="activities"><span class="nav-icon">☑</span>Laporan kegiatan</button>
      <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span>Inventori & stok</button>
      <div class="nav-label" style="margin-top:14px">Pengelolaan</div>
      <button class="nav-item" data-page="finance"><span class="nav-icon">◈</span>Keuangan</button>
      <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Laporan cabang</button>
      <button class="nav-item" data-page="people"><span class="nav-icon">♙</span>SDM & kontrak</button>
      <button class="nav-item" data-page="announcements"><span class="nav-icon">✦</span>Pengumuman & KPI</button>
      <button class="nav-item" data-page="admin"><span class="nav-icon">⚙</span>Pengguna & menu</button>
    </nav>
    <div class="nav-spacer"></div>
    <div class="sidebar-note"><b>Demo interaktif</b>Gunakan pilihan peran di kanan atas untuk melihat sudut pandang PIC, HRGA, Finance, Direktur, dan Admin.</div>
    <div class="user-mini"><div class="avatar" id="miniInitial">DR</div><div><b id="miniName">Dina Rahma</b><small id="miniRole">Direktur</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Buka menu">☰</button>
      <div class="crumb">Workspace <span style="margin:0 7px;color:#b1bac8">/</span> <b id="crumbTitle">Ringkasan</b></div>
      <div class="top-actions">
        <label class="role-wrap"><span>Lihat sebagai</span><select id="roleSelect" aria-label="Pilih peran"><option>Direktur</option><option>PIC</option><option>HRGA</option><option>Finance</option><option>Administrator</option></select></label>
        <button class="icon-btn" id="bellBtn" aria-label="Notifikasi">♧</button>
        <div class="avatar" style="height:34px;width:34px" id="topInitial">DR</div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const roles={Direktur:{name:'Dina Rahma',initial:'DR',branch:'Semua cabang'},PIC:{name:'Rizky Pratama',initial:'RP',branch:'Cabang Katering 03'},HRGA:{name:'Nadia Putri',initial:'NP',branch:'Semua cabang'},Finance:{name:'Fajar Nugroho',initial:'FN',branch:'Semua cabang'},Administrator:{name:'Admin Demo',initial:'AD',branch:'Semua cabang'}};
  const pageTitles={overview:'Ringkasan',attendance:'Absensi',requests:'Pengajuan',activities:'Laporan kegiatan',inventory:'Inventori & stok',finance:'Keuangan',reports:'Laporan cabang',people:'SDM & kontrak',announcements:'Pengumuman & KPI',admin:'Pengguna & menu'};
  let currentPage='overview', currentRole='Direktur', selectedBranch='Semua cabang';
  const content=document.getElementById('content');
  const money=n=>'Rp '+new Intl.NumberFormat('id-ID').format(n);
  function shell(title,subtitle,action='') {return `<div class="page-heading"><div><div class="eyebrow">Workspace operasional</div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-right"><span class="date-pill">◷ &nbsp; Sabtu, 3 Oktober 2026</span>${action}</div></div><div class="notice"><span>✦</span><div><strong>Prototipe demo.</strong> Data pada halaman ini hanya contoh; autentikasi, penyimpanan, GPS/kamera, dan persetujuan sungguhan belum terhubung.</div></div>`}
  function stats(items){return `<section class="grid stats">${items.map(([label,value,foot,icon])=>`<article class="card stat-card"><div class="stat-head">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></article>`).join('')}</section>`}
  function activityList(){return `<article class="card"><div class="section-title"><div><h2>Aktivitas terbaru</h2><p>Yang perlu diketahui hari ini</p></div><button class="link-btn" data-go="reports">Lihat semua →</button></div><div class="activity-list"><div class="activity"><div class="activity-mark">⇧</div><div class="activity-text"><b>Pengajuan anggaran — Cabang 03</b><small>Rizky Pratama · 10 menit lalu</small></div><span class="status wait">Menunggu</span></div><div class="activity"><div class="activity-mark">◷</div><div class="activity-text"><b>Absensi masuk — Cabang 01</b><small>4 PIC sudah check-in · 08.04</small></div><span class="status ok">Tercatat</span></div><div class="activity"><div class="activity-mark">☑</div><div class="activity-text"><b>Laporan kegiatan — Cabang 02</b><small>Dokumentasi 3 foto · 07.52</small></div><span class="status info">Dikirim</span></div><div class="activity"><div class="activity-mark">▤</div><div class="activity-text"><b>Pengecekan inventori mingguan</b><small>Cabang Hospitaliti · kemarin</small></div><span class="status ok">Selesai</span></div></div></article>`}
  function approvals(){return `<article class="card"><div class="section-title"><div><h2>Perlu persetujuan</h2><p>Alur berjalan PIC → HRGA → Finance → Direktur</p></div><button class="link-btn" data-go="requests">Semua →</button></div><div class="approval-list"><div class="approval"><div class="avatar">RP</div><div class="approval-body"><b>Anggaran bahan operasional</b><small>Cabang Katering 03 · ${money(2750000)}</small></div><span class="status wait">Finance</span></div><div class="approval"><div class="avatar">SA</div><div class="approval-body"><b>Pengajuan cuti — 1 hari</b><small>Cabang Katering 02 · 6 Okt</small></div><span class="status wait">HRGA</span></div><div class="approval"><div class="avatar">MW</div><div class="approval-body"><b>Biaya perbaikan chiller</b><small>Cabang Hospitaliti · ${money(1200000)}</small></div><span class="status wait">Direktur</span></div></div></article>`}
  function chartCard(){const vals=[[62,49],[77,64],[70,55],[84,69],[68,50],[91,74],[80,67]];return `<article class="card chart-card"><div class="chart-head"><div class="section-title"><div><h2>Performa cabang</h2><p>Ringkasan aktivitas selama 7 hari</p></div></div><div class="chart-legend"><span><i class="legend-dot"></i>Kegiatan</span><span><i class="legend-dot two"></i>Absensi</span></div></div><div class="chart">${vals.map((v,i)=>`<div class="bar-group"><div class="bar" style="height:${v[0]}%"></div><div class="bar green" style="height:${v[1]}%"></div><span class="bar-label">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'][i]}</span></div>`).join('')}</div><div class="chart-caption">Indeks aktivitas contoh · 0–100%</div></article>`}

ru ditambahkan (demo).">＋ Tambah menu / modul</button></article></div><div class="grid quick-grid"><button class="quick-action" data-toast="Pengaturan peran demo dibuka."><i>♙</i><span><b>Atur peran</b><small>Hak akses tiap kelompok</small></span></button><button class="quick-action" data-toast="Pengaturan password memerlukan backend."><i>⌑</i><span><b>Reset password</b><small>Alur pengaturan akun</small></span></button><button class="quick-action" data-toast="Cabang dapat ditambahkan dari pengaturan admin."><i>⌂</i><span><b>Kelola cabang</b><small>7 katering + hospitaliti</small></span></button><button class="quick-action" data-toast="Modul baru akan muncul sebagai item menu."><i>＋</i><span><b>Tambah modul</b><small>Perluasan fitur mendatang</small></span></button></div>`}

  function wirePage(){content.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));content.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)));const branch=document.getElementById('branchSelect');if(branch)branch.addEventListener('change',e=>{selectedBranch=e.target.value;toast('Lokasi dipilih: '+selectedBranch)});const rp=document.getElementById('reportBranch');if(rp)rp.addEventListener('change',e=>toast('Filter: '+e.target.value));const checkin=document.getElementById('clockIn');if(checkin)checkin.addEventListener('click',()=>{document.getElementById('checkinTime').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});toast('Check-in demo tercatat di tampilan.')});const checkout=document.getElementById('clockOut');if(checkout)checkout.addEventListener('click',()=>{document.getElementById('checkoutTime').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});toast('Check-out demo tercatat di tampilan.')});const updateChecks=()=>{const boxes=[...content.querySelectorAll('.task-check')];const done=boxes.filter(x=>x.checked).length;const counter=document.getElementById('taskCounter');if(counter)counter.textContent=`${done} / ${boxes.length} selesai`;const bar=document.getElementById('taskProgress');if(bar)bar.style.width=(done/boxes.length*100)+'%'};content.querySelectorAll('.task-check').forEach(x=>x.addEventListener('change',updateChecks));const addTask=document.getElementById('addTask');if(addTask)addTask.addEventListener('click',()=>{const list=content.querySelector('.check-list');const row=document.createElement('label');row.className='check-row';row.innerHTML='<input class="task-check" type="checkbox"><span>Checklist tambahan baru</span>';list.appendChild(row);row.querySelector('input').addEventListener('change',updateChecks);updateChecks()});const form=document.getElementById('requestForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();toast('Contoh pengajuan siap — belum dikirim ke server.')});const stock=document.getElementById('stockForm');if(stock)stock.addEventListener('submit',e=>{e.preventDefault();toast('Catatan stok demo tersimpan di tampilan.')});const submitActivity=document.getElementById('submitActivity');if(submitActivity)submitActivity.addEventListener('click',()=>toast('Laporan demo siap ditinjau oleh HRGA.'));const af=document.getElementById('announcementForm');if(af)af.addEventListener('submit',e=>{e.preventDefault();toast('Pratinjau pengumuman tersedia di demo.')});}
